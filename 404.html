<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Stackly</title>

  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
  <link rel="stylesheet" href="assets/css/404.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <main class="nf-page">

    <!-- Ambient blob background, same family as hero -->
    <div class="nf-blob" aria-hidden="true"></div>

    <!-- Floating dot grid, business-analytics motif -->
    <div class="nf-grid" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="container nf-inner">

      <!-- Badge -->
      <div class="nf-badge" id="nfBadge">
        <span class="dot"></span> Error 404
      </div>

      <!-- Big analytics-styled 404 with a broken bar chart forming the "4 0 4" -->
      <div class="nf-figure" id="nfFigure" aria-hidden="true">
        <h1 class="nf-number" id="nfNumber">404</h1>
      </div>

      <h1 class="nf-title" id="nfTitle">
        This <span class="accent">metric</span> doesn't exist.
      </h1>

      <p class="nf-text" id="nfText">
        The page you're looking for was moved, renamed, or never tracked in the first place.
        Let's get you back to a dashboard that actually reports something.
      </p>

      <div class="nf-actions" id="nfActions">
        <a href="index.html" class="btn btn-primary btn-lg" id="btnHome">
          Back to Home
          <span class="btn-icon"><i class="fa-solid fa-arrow-right"></i></span>
        </a>
        <button type="button" class="btn btn-outline-dark btn-lg" id="btnBack">
          Go Back
          <span class="btn-icon"><i class="fa-solid fa-arrow-left"></i></span>
        </button>
      </div>

    </div>
  </main>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="assets/js/404.js"></script>
</body>

</html>
