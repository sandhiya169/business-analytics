<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body>

  <main class="auth auth--signup">

    <!-- LEFT: form -->
    <section class="auth-panel">
      <a class="auth-logo" href="index.html" aria-label="Stackly home">
        <img src="assets/images/stackly-logo.webp" alt="Stackly">
      </a>

      <div class="signup-card">
        <div class="signup-head">
          <p class="signup-eyebrow">Get started for free</p>
          <h1 class="signup-title">Create your account</h1>
        </div>
        <form id="signupForm" class="card-form" novalidate>

          <fieldset class="role-chips">
            <legend>Sign up as</legend>
            <div class="role-options role-options--2">
              <label class="role-option">
                <input type="radio" name="role" value="executive" checked>
                <span>Executive</span>
              </label>
              <label class="role-option">
                <input type="radio" name="role" value="analyst">
                <span>Analyst</span>
              </label>
            </div>
          </fieldset>

          <div class="field">
            <label class="sr-only" for="suName">Full Name</label>
            <input class="serif-input" id="suName" type="text" placeholder="Full Name" autocomplete="name"
              data-validate="name" aria-describedby="suNameError">
            <p class="field-error" id="suNameError" aria-live="polite"></p>
          </div>

          <div class="field">
            <label class="sr-only" for="suEmail">Email Address</label>
            <input class="serif-input" id="suEmail" type="email" inputmode="email" placeholder="Email Address"
              autocomplete="email" data-validate="email" aria-describedby="suEmailError">
            <p class="field-error" id="suEmailError" aria-live="polite"></p>
          </div>

          <div class="field">
            <label class="sr-only" for="suPassword">Password</label>
            <div class="pw-wrap">
              <input class="serif-input" id="suPassword" type="password" placeholder="Password"
                autocomplete="new-password" data-validate="newPassword" aria-describedby="suPasswordError">
              <button type="button" class="pw-toggle" aria-label="Show password" data-target="suPassword">
                <svg class="eye-icon eye-icon--show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-icon eye-icon--hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <p class="field-error" id="suPasswordError" aria-live="polite"></p>
          </div>

          <div class="field">
            <label class="sr-only" for="suConfirm">Confirm Password</label>
            <div class="pw-wrap">
              <input class="serif-input" id="suConfirm" type="password" placeholder="Confirm Password"
                autocomplete="new-password" data-validate="confirm" aria-describedby="suConfirmError">
              <button type="button" class="pw-toggle" aria-label="Show password" data-target="suConfirm">
                <svg class="eye-icon eye-icon--show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-icon eye-icon--hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <p class="field-error" id="suConfirmError" aria-live="polite"></p>
          </div>

          <button type="submit" class="btn-signup" id="signupSubmit">Sign Up</button>

          <div class="card-foot">
            <a class="btn-back" href="index.html" id="backBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5M11 6l-6 6 6 6" />
              </svg>
              Back to Home
            </a>
            <p class="switch-line">Already have an account? <a href="login.html">Log in</a></p>
          </div>

          <p class="form-status" id="signupStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <!-- RIGHT: showcase (6.webp background image, see auth.css) -->
    <aside class="auth-visual auth-visual--hex">
      <div class="showcase-copy">
        <span class="showcase-eyebrow">AI Workflow Automation</span>
        <h2 class="showcase-title">Automate smarter, scale faster</h2>
        <p class="showcase-text">Create your account and put repetitive work on autopilot from day one.</p>
        <ul class="showcase-points">
          <li>Free 7-day trial</li>
          <li>No credit card required</li>
          <li>Cancel anytime</li>
        </ul>
      </div>
    </aside>

  </main>

  <script src="assets/js/auth.js"></script>
</body>

</html>
